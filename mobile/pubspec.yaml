name: tangail_app
description: টাঙ্গাইল জেলার সেবা ও তথ্য অ্যাপ

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.10

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Utils
  url_launcher: ^6.2.6
  share_plus: ^10.0.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.3

  # Local storage
  shared_preferences: ^2.2.3

  # HTTP for prayer times API
  http: ^1.2.1

  # Time formatting
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
